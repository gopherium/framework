version: "2"

linters:
  default: standard
  enable:
    - cyclop
    - depguard
    - gocognit
    - lll
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 15
    lll:
      line-length: 120
    revive:
      rules:
        - name: blank-imports
          disabled: true
        - name: exported
    depguard:
      rules:
        dependency-purity:
          list-mode: strict
          allow:
            - $gostd
            - github.com/gopherium/framework/pluginkit
            - github.com/vektah/gqlparser/v2
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gocognit

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gopherium/framework
