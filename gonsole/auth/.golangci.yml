version: "2"

linters:
  default: standard
  enable:
    - cyclop
    - depguard
    - forbidigo
    - gocognit
    - lll
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    cyclop:
      max-complexity: 10
    gocognit:
      min-complexity: 15
    lll:
      line-length: 120
    revive:
      rules:
        - name: blank-imports
          disabled: true
        - name: exported
    depguard:
      rules:
        auth-purity:
          list-mode: strict
          files:
            - "**/*.go"
          allow:
            - $gostd
            - github.com/gopherium/framework/gonsole
            - github.com/gopherium/gouncer
            - github.com/jackc/pgx/v5
            - github.com/google/uuid
            - github.com/peterldowns/pgtestdb
            - github.com/pressly/goose/v3
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^sql\.Open(DB)?$
          pkg: ^database/sql$
          msg: take the run's database handle from gonsole.Call.DB
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - cyclop
          - gocognit

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gopherium/framework
